{id:"n1", n:"Thomas J. Watson Sr.", y:"1874 to 1956", h:"IBM's history", w:"Led the company that became IBM from 1914 and made it a global business.", i:"He coined the motto THINK in the 1910s. It is the oldest layer of our house and one of IBM's espoused values on our Schein slide.", s:"Slides 4 and 8"},
{id:"n2", n:"Lou Gerstner", y:"born 1942", h:"IBM's history", w:"IBM's chief executive from 1993 to 2002, brought in from outside during the company's worst crisis.", i:"In 1993 he stopped the plan to split IBM into separate companies: “we made a very important decision to keep the company together.” That is our integration layer.", s:"Slide 4"},
{id:"n3", n:"Arvind Krishna", y:"chief executive since 2020", h:"IBM today", w:"IBM's current chief executive and chairman.", i:"Author of the July 2026 letter: “We did not adapt and move quickly enough.” The first quote of our talk.", s:"Slide 2, and the top of the ladder on slide 6"},
{id:"n4", n:"W. Ross Ashby", y:"1903 to 1972", h:"Theory · Chapter 6", w:"British psychiatrist and a founder of cybernetics, the science of control and feedback.", i:"Law of requisite variety: only variety absorbs variety. The ability to respond must sit where the situations arrive, at the edge.", s:"Slides 6, 10 and 11"},
{id:"n5", n:"Stafford Beer", y:"1926 to 2002", h:"Theory · Chapter 6", w:"British management thinker who applied cybernetics to organisations.", i:"Viable System Model: a viable organisation needs units with operational autonomy plus coordination of the whole. At IBM Switzerland, coordination dominates.", s:"Slides 6 and 11"},
{id:"n6", n:"Tom Burns and G. M. Stalker", y:"1961", h:"Theory · contingency", w:"British researchers who studied how firms cope with technological change.", i:"Mechanistic versus organic organisations: strict hierarchy fits a stable world, flexible roles fit a changing one. Our labels for the layers come from them.", s:"Slide 4"},
{id:"n7", n:"Edgar Schein", y:"1928 to 2023", h:"Theory · Chapter 7", w:"Professor at MIT, the classic author on organisational culture.", i:"Three levels of culture: artifacts, espoused values, underlying assumptions. The frame of our culture slide.", s:"Slide 8"},
{id:"n8", n:"Amy Edmondson", y:"born 1959", h:"Theory · Chapter 7", w:"Professor at Harvard Business School.", i:"Psychological safety: people can admit mistakes, ask and disagree without fear. At IBM it depends on the manager, which is why Recommendation 2 trains managers.", s:"Slides 8 and 12"},
{id:"n9", n:"Paul Lawrence and Jay Lorsch", y:"1967", h:"Theory · contingency", w:"Harvard researchers who studied how firms in different environments organise themselves.", i:"Differentiation creates the need for integration. More layers mean more different parts, so more need for the people who connect them. It is the name for our thesis.", s:"Slides 3, 7 and 10"}
];

P2.it=[
{id:"e1", t:"Capitolo 1 · Quattro tipi di verità",
 p:["Nella Parte 1 hai ascoltato una storia. Ora la verifichi. Da qui in avanti, ogni frase della nostra presentazione porta una piccola etichetta che dice da dove viene.",
 "<b>FACT</b>: scritto in una fonte pubblica ufficiale, come il rapporto annuale di IBM o un comunicato stampa. <b>FINDING</b>: sentito nella nostra intervista con qualcuno che lavora in IBM. <b>INTERPRETATION</b>: una nostra conclusione, dopo aver applicato una teoria del corso. <b>ASSUMPTION</b>: qualcosa che crediamo, ma che non possiamo ancora dimostrare.",
 "Riguarda il mistero. La frase dell'amministratore delegato, <q>We did not adapt and move quickly enough</q>, viene da una lettera pubblicata da IBM il 14 luglio 2026. È un FACT. La risposta <q>We are pretty good in speed</q> viene dalla nostra intervista del 14 ottobre 2026. È un FINDING. La nostra tesi che siano vere entrambe è una INTERPRETATION.",
 "Perché conta: la regola del corso dice che quello che produce un'AI non è mai una prova, e il voto premia le prove. Un'etichetta su ogni affermazione mostra al pubblico, e al docente, che sai distinguere tra quello che hai visto e quello che pensi."],
 task:"Prendi tre frasi qualsiasi dalla Parte 1 e dai a ciascuna un'etichetta (FACT, FINDING, INTERPRETATION o ASSUMPTION). Spiega ogni scelta in una riga."},
{id:"e2", t:"Capitolo 2 · L'azienda in numeri",
 p:["IBM, International Business Machines, è stata fondata nel 1911 e ha sede ad Armonk, vicino a New York.",
 "Nel 2025 i suoi ricavi sono stati di <b>67,5 miliardi di dollari</b> (rapporto annuale IBM 2025). Circa il 44% dal software, il 31% dalla consulenza e il 23% dall'infrastruttura. Più dell'80% dei ricavi viene da clienti che comprano da tutte e tre le parti insieme, secondo la lettera del presidente nello stesso rapporto. È il dettaglio che la Parte 1 ti chiedeva di ricordare.",
 "IBM dice dei suoi mainframe che sono preferiti da 44 delle 50 banche più grandi del mondo. È un'affermazione di IBM stessa, quindi su una slide scriviamo: <i>secondo IBM</i>.",
 "Il suo scopo, con parole sue: <q>IBM aspires to be the catalyst that makes the world work better.</q> E il suo motto più antico è una sola parola: THINK.",
 "Una lezione di verifica. Chi abbiamo intervistato ha detto che il laboratorio svizzero ha <q>six or seven</q> premi Nobel. La pagina storica del laboratorio dice due, in fisica, nel 1986 e nel 1987. Anche chi lavora dentro un'azienda può sbagliare sui fatti. I findings ti dicono come funzionano le cose. I fatti li controlli comunque alla fonte.",
 "Chi vuole cosa, e con quale orologio. Gli <b>azionisti</b> vogliono risultati ogni trimestre, e possono vendere le loro azioni in un giorno. I <b>clienti</b> vogliono soluzioni su misura che durano anni. I <b>dipendenti</b> vogliono spazio per lavorare bene, e dopo luglio 2026 hanno sentito <q>way more pressure from the top</q>. Tre aspettative che tirano in direzioni diverse, su tre orologi diversi: un trimestre, diversi anni, ogni giorno di lavoro."],
 task:"Quale numero di questo capitolo metteresti sulla slide della Direzione, e perché proprio quello? Poi spiega in due frasi perché non usiamo il numero dei Nobel dato nell'intervista."},
{id:"e3", t:"Capitolo 3 · I piani della casa, con le date",
 p:["Nella Parte 1 la casa cresceva un piano alla volta. Ecco i piani veri.",
 "<b>Anni 1910</b>: Thomas J. Watson Sr. conia THINK. Un'azienda classica: gerarchia chiara, regole, ordine.",
 "<b>1993</b>: IBM perde circa 8,1 miliardi di dollari, una delle perdite più grandi nella storia delle imprese. Sul tavolo c'è il piano di dividerla in aziende indipendenti. Il nuovo amministratore delegato, Lou Gerstner, ferma il piano. Con parole sue: <q>In 1993 we made a very important decision to keep the company together.</q> IBM diventa un'azienda integrata.",
 "<b>Dal 2013</b>: l'Enterprise Design Thinking diffonde in IBM squadre agili guidate dal design.",
 "<b>2019</b>: IBM compra Red Hat, un'azienda di software open source, per circa 34 miliardi di dollari. <b>2021</b>: separa il suo business dei servizi di infrastruttura, che diventa un'azienda indipendente chiamata Kyndryl.",
 "Nessuno di questi passi ha sostituito quello prima. La gerarchia c'è ancora. L'integrazione c'è ancora. Le squadre agili stanno sopra. L'ecosistema di aziende comprate e separate sta intorno. Ecco cosa intendiamo con strati, non sostituzioni.",
 "Una cautela: questa storia viene dalle fonti di IBM e da Gerstner stesso. La nostra intervista non ne parla. Per questo ha una sola slide."],
 task:"Perché conta che nessuno strato sia stato tolto? Spiegalo con una conseguenza concreta che hai visto nella Parte 1."},
{id:"e4", t:"Capitolo 4 · La scala, con le parole di chi ci lavora",
 p:["Ecco le parole esatte dietro il Capitolo 3 della Parte 1. Leggile con calma: sulla slide 6 le citerai.",
 "Sulla forma: <q>if you look at the org chart for IBM, it's super tall.</q> Sul perché i paesi sono raggruppati: <q>it's a way to facilitate coordination and control</q>, perché <q>the general strategy or how we should work in the different countries comes from the top.</q>",
 "Sulla Svizzera dentro DACH: <q>since DACH is led through Germany, it's of course easy to assume that it's the same as Germany, but it isn't.</q> Le differenze nominate: il sistema politico, <q>how we value security</q>, e <q>we are a country of banks</q>.",
 "Sulla velocità: <q>if it's of relevance for global, it goes rather fast, if it's just a Swiss need you need to go through the rows.</q> Sul personale in più: se il livello regionale dice no, <q>we will not ask</q> l'amministratore delegato. <q>So it's done.</q>",
 "E ora la parte che tutti dimenticano. La regola sulla velocità è stata introdotta con <q>that's my opinion, a rule of thumb</q>, con l'aggiunta <q>sometimes you can jump it</q>, e che si può chiamare qualcuno più in alto se <q>you are really sure why you are calling them</q>.",
 "Sulla slide diventa: FINDING, regola pratica di chi ci lavora. Togliere la cautela trasformerebbe un'opinione in un fatto. Chi ce l'ha detto sarà in sala, e se ne accorgerà."],
 task:"Scrivi la frase che diresti ad alta voce sulla slide 6 a proposito della scala, con la cautela inclusa. Poi scrivi perché la cautela ti rende più credibile, non meno."},
{id:"e5", t:"Capitolo 5 · Le persone e la cultura, con le loro parole",
 p:["Dietro il Capitolo 2 della Parte 1: durante l'assunzione la rete è stata molto incoraggiata, e i caffè hanno mostrato <q>the power dynamics in the company, in the departments which were closest to me</q>. Poi: <q>that is invisible in the org chart, right? You have certain managers which have been there for 20 years. They have way more influence than the others, even though they are on the same level.</q> Abbiamo controllato questa frase su tre trascrizioni: la parola è <i>invisible</i>.",
 "Dietro il Capitolo 4: <q>we have five people</q>, i deal maker, che <q>work across different brands, across different offerings, across different segmentations</q> e <q>help, usually in these cases, to find a way</q>. Probabilmente un gruppo svizzero: dillo. E l'offerta: <q>It's not graspable. Also as an employee it's not graspable.</q> Ma anche: <q>that also helps to be adaptable to the environment. Pros and cons.</q>",
 "Dietro il Capitolo 5: <q>We experienced way more pressure from the top</q>, e <q>It's a joint adventure</q>. Lo slogan: <q>speed over perfection</q>, <q>really pushed also from the top</q>. La sicurezza: <q>it also highly depends which manager</q>, e con un grande contratto perso <q>you will feel it</q>. La libertà: <q>if you perform well, you have quite a lot of freedom</q>, e <q>as long as you perform, it's fine</q>."],
 task:"Scegli le tre citazioni di questo capitolo che vorresti di più difendere nelle domande dopo la presentazione. Per ognuna, di' in una riga cosa dimostra."},
{id:"e6", t:"Capitolo 6 · Quanto possiamo fidarci?",
 p:["Tutti i nostri findings vengono da una sola persona, che studia e lavora in IBM da circa un anno, nell'unità di supporto del direttore generale di IBM Svizzera, e che è anche il nostro docente.",
 "Quella posizione ha due lati. È una vista ampia: vicino alla cima dell'organizzazione svizzera, in contatto con molti reparti. Ma è una vista sola, da un punto solo, e può influenzare quello che si è scelto di dire.",
 "I nostri dati arrivano fino al secondo trimestre del 2026. IBM pubblica i risultati del terzo trimestre il 21 ottobre alle 17:00 ora di New York, poche ore dopo la nostra presentazione. Se qualcuno lo chiede, lo diciamo.",
 "Dichiarare i limiti non è una debolezza. È quello che il corso chiama separare le prove dalle supposizioni, e fa parte di una diagnosi ben fondata."],
 task:"Qualcuno nel pubblico chiede: come fate a sapere che questo vale per tutta IBM, e non solo per una persona a Zurigo? Scrivi la tua risposta in quattro o cinque frasi."}
];

P3.it=[
{id:"a1", t:"Capitolo 1 · Etichettare o spiegare",
 p:["Ora conosci la storia e le prove. La Parte 3 ti dà gli strumenti che il corso usa per spiegarle.",
 "Prima, la distinzione più importante per il voto. <b>Etichettare</b> è dire: IBM è una matrice. <b>Spiegare</b> è dire: IBM vende con tre unità allo stesso cliente, quindi qualcuno deve decidere chi guida, ed è lì che rallenta. Stessi fatti. La seconda frase usa la teoria per mostrare un meccanismo, una causa e un effetto.",
 "Il nostro quadro viene dal capitolo 6 del corso: l'<b>Organizational Viability Framework</b>. Un'organizzazione resta viva quando tre cose stanno insieme: <b>Direzione</b> (scopo, strategia), <b>Struttura</b> (ruoli, processi, diritti di decisione) e <b>Persone</b> (motivazione, cultura, relazioni).",
 "Dentro il triangolo ci sono tre tensioni, e un'organizzazione viva gestisce entrambi gli estremi di ciascuna invece di sceglierne uno: <b>ambidestrezza</b>, esplorare il nuovo contro sfruttare ciò che funziona oggi; <b>adattabilità</b>, trasformarsi contro restare stabili; <b>coerenza</b>, autonomia contro controllo.",
 "Tutta la presentazione percorre questo triangolo, angolo per angolo, e finisce sulle tensioni."],
 task:"Scrivi una frase su IBM che si limita a etichettare, poi riscrivila in modo che spieghi. Usa qualcosa della Parte 1 o 2."},
{id:"a2", t:"Capitolo 2 · Non esiste un modo migliore",
 p:["La teoria della contingenza dice che non esiste un unico modo migliore di organizzarsi. La struttura giusta dipende dall'ambiente.",
 "Tom Burns e G. M. Stalker le hanno dato due parole classiche. Un'organizzazione <b>meccanicistica</b> ha gerarchia rigida e regole fisse: funziona in un ambiente stabile. Un'organizzazione <b>organica</b> ha ruoli flessibili e comunicazione orizzontale: funziona quando le cose cambiano in fretta.",
 "Paul Lawrence e Jay Lorsch hanno aggiunto l'idea che calza meglio con la nostra tesi. Più le parti di un'organizzazione devono essere diverse, ognuna adatta al suo mercato, più c'è <b>differenziazione</b>. E più c'è differenziazione, più l'organizzazione ha bisogno di <b>integrazione</b>: persone e meccanismi che fanno lavorare insieme le parti diverse. Più strati vogliono dire più differenziazione, quindi più bisogno di integrazione, e l'attrito compare proprio dove l'integrazione è debole: nelle giunture.",
 "I nostri strati sono la contingenza in azione. Ogni piano della casa ha risposto a un ambiente nuovo: la gerarchia per un mercato stabile, l'integrazione per clienti che volevano una soluzione sola, le squadre agili per il software e la velocità, l'ecosistema per l'AI e l'open source.",
 "Spiega anche qualcosa che sembra un difetto. Sui concorrenti ci è stato detto: <q>in all the different offerings we have, we have a bit different competitors.</q> Ogni business affronta il suo mercato, quindi unità separate hanno senso. Per questo non raccomandiamo di unirle.",
 "Punto cieco: la contingenza spiega l'adattamento all'ambiente, ma dice poco sul potere e sulla politica interna."],
 task:"Con la teoria della contingenza, spiega perché IBM resta divisa in business separati anche se i suoi clienti comprano da tutti insieme."},
{id:"a3", t:"Capitolo 3 · Solo la varietà assorbe la varietà",
 p:["La <b>legge della varietà necessaria</b> di W. Ross Ashby: per gestire una situazione, un sistema ha bisogno di almeno tante risposte possibili quante sono le variazioni della situazione. Solo la varietà assorbe la varietà.",
 "Pensa a un portiere che sa fare un solo tipo di parata. Ogni altro tiro è gol. Più tipi di tiro, più tipi di parata servono, e servono dove arrivano i tiri, non in un ufficio lontano.",
 "IBM nel suo insieme ha una varietà enorme: <q>we actually have nearly everything</q>. Questo è Ashby che lavora a favore di IBM, e ce l'ha detto anche chi ci lavora: aiuta IBM ad adattarsi. Ma la capacità di decidere sta in alto sulla scala. Al confine svizzero, dove arrivano le situazioni locali, la varietà di decisioni disponibili è piccola. Ecco l'attrito.",
 "Stafford Beer ne ha fatto il <b>Viable System Model</b>: un'organizzazione viva ha bisogno di unità con vera autonomia operativa, più una coordinazione che tiene insieme il tutto. In IBM Svizzera la coordinazione domina sull'autonomia.",
 "È la teoria dietro la Raccomandazione 1: dare al paese un margine definito di decisioni e mettere una scadenza alle escalation.",
 "La Raccomandazione 1 in una coppia chiara. <b>Beneficio</b>: risposte più rapide per i clienti svizzeri, e decisioni prese dove arrivano le situazioni. <b>Rischio</b>: meno coordinazione e controllo, paesi che cominciano a decidere in modo diverso, e un centro che potrebbe non voler cedere potere."],
 task:"Spiega la Raccomandazione 1 con la legge di Ashby, con parole tue, usando la parola “varietà” al massimo una volta."},
{id:"a4", t:"Capitolo 4 · I livelli invisibili",
 p:["Ogni organizzazione ha un lato formale, l'organigramma, e un'<b>organizzazione informale</b>: relazioni, fiducia e regole non scritte che decidono come si lavora davvero. Le due mappe della Parte 1.",
 "Edgar Schein descrive la cultura su tre livelli. <b>Artefatti</b>: ciò che vedi e senti, come lo slogan <q>speed over perfection</q>. <b>Valori dichiarati</b>: ciò che l'organizzazione dice di apprezzare, come THINK. <b>Presupposti di fondo</b>: ciò che le persone credono senza dirlo. Il nostro, come interpretazione: i risultati comprano libertà, e i numeri del trimestre dettano il tempo.",
 "Quando ciò che si dice e ciò che si premia non coincidono, c'è uno scarto tra valori dichiarati e valori praticati. La nostra prova: la sicurezza <q>highly depends which manager</q>.",
 "Amy Edmondson chiama <b>sicurezza psicologica</b> la sensazione di poter ammettere un errore senza essere puniti. Chi abbiamo intervistato l'ha avuta, con un piccolo errore. Non con un grande contratto perso.",
 "È la teoria dietro la Raccomandazione 2: sostenere le persone che collegano, e formare i manager alla sicurezza psicologica, senza trasformare l'informale nell'ennesimo strato formale.",
 "Un concetto del corso rende preciso il “non un altro strato”: le <b>comunità di pratica</b>, gruppi di persone che condividono un mestiere e imparano l'una dall'altra attraverso l'organigramma (il termine viene da Jean Lave ed Etienne Wenger). Sostenere una comunità di venditori e deal maker non è come creare un nuovo reparto. La Raccomandazione 2 in una coppia chiara. <b>Beneficio</b>: un'integrazione che dipende meno da chi conosci, e più spazio per ammettere gli errori. <b>Rischio</b>: formalizzare l'informale può ucciderlo, e l'effetto è difficile da misurare."],
 task:"Spiega perché il presupposto di fondo sulla nostra slide di Schein è segnato INTERPRETATION, e perché è proprio quello che Schein si aspetterebbe."},
{id:"a5", t:"Capitolo 5 · Dove sta IBM",
 p:["Ora metti tutto sul triangolo.",
 "<b>Ambidestrezza</b>: IBM esplora soprattutto comprando aziende e con i suoi laboratori di ricerca. Dopo l'estate del 2026 è stata tirata verso lo sfruttamento: tagli di budget, obiettivi trimestrali.",
 "<b>Adattabilità</b>: si trasforma aggiungendo strati, quindi la stabilità si accumula. Veloce dentro, <q>not fast enough</q> per il mercato, nelle parole del suo amministratore delegato.",
 "<b>Coerenza</b>: autonomia a condizione dei risultati. Libertà se rendi, domande e pressione centrale quando i risultati calano.",
 "Il controllo di viabilità del corso: IBM funziona oggi? Sì. Sopravvive? Sì. Si sviluppa per domani? A rischio. L'ultimo è un nostro giudizio, e lo etichettiamo come tale.",
 "Punti di forza e costi vanno insieme: l'ampiezza che rende IBM adattabile è la stessa ampiezza che nessuno riesce ad afferrare."],
 task:"Scegli una delle tre tensioni e difendi dove abbiamo messo IBM, usando un FACT e un FINDING."},
{id:"a6", t:"Capitolo 6 · Il boss finale",
 p:["Dopo la presentazione ci sono cinque minuti di domande, e chi chiede potrebbe essere la stessa persona che abbiamo intervistato. Ecco cinque domande che potrebbero arrivare.",
 "<b>1.</b> Il margine di decisione svizzero non è solo un nuovo strato, proprio quello che dite che IBM dovrebbe evitare?",
 "<b>2.</b> Dite che la catena rallenta la Svizzera. Qual è il costo, concretamente?",
 "<b>3.</b> Perché lo chiamate un problema di viabilità, se IBM è redditizia e ha più di cent'anni?",
 "<b>4.</b> Il vostro presupposto di fondo, i numeri del trimestre dettano il tempo: dov'è la prova?",
 "<b>5.</b> Se poteste farmi un'altra domanda, quale sarebbe?"],
 task:"Scegli la domanda più difficile per te e scrivi la tua risposta, come la diresti in sala.",
 reveal:"Cosa contiene una risposta forte. <b>1.</b> No: è un insieme di diritti di decisione dentro il livello paese che esiste già, non una nuova casella. Nomina onestamente il suo prezzo. <b>2.</b> L'esempio del personale e i contratti che scivolano al trimestre dopo; di' che la regola sulla velocità era una regola pratica personale. <b>3.</b> La viabilità non è solo sopravvivere: funzionare oggi, sopravvivere, svilupparsi per domani. La lettera stessa dell'amministratore delegato mette in dubbio il terzo punto. <b>4.</b> È un'interpretazione costruita sui findings: speed over perfection spinto dall'alto, la pressione dopo il secondo trimestre, i contratti che slittano oltre la fine del trimestre. Di' che è nostra. <b>5.</b> Usala: chiedi come verrebbero prese davvero le decisioni del margine svizzero, così le domande diventano una conversazione."}
];

NAMES.it=[
{id:"n1", n:"Thomas J. Watson Sr.", y:"1874 - 1956", h:"La storia di IBM", w:"Ha guidato dal 1914 l'azienda che è diventata IBM e l'ha resa globale.", i:"Ha coniato il motto THINK negli anni 1910. È lo strato più antico della nostra casa e uno dei valori dichiarati sulla slide di Schein.", s:"Slide 4 e 8"},
{id:"n2", n:"Lou Gerstner", y:"nato nel 1942", h:"La storia di IBM", w:"Amministratore delegato di IBM dal 1993 al 2002, arrivato da fuori nella crisi peggiore dell'azienda.", i:"Nel 1993 ha fermato il piano di dividere IBM in aziende separate: “we made a very important decision to keep the company together.” È il nostro strato dell'integrazione.", s:"Slide 4"},
{id:"n3", n:"Arvind Krishna", y:"amministratore delegato dal 2020", h:"IBM oggi", w:"L'attuale amministratore delegato e presidente di IBM.", i:"Autore della lettera di luglio 2026: “We did not adapt and move quickly enough.” La prima citazione della presentazione.", s:"Slide 2, e la cima della scala sulla slide 6"},
{id:"n4", n:"W. Ross Ashby", y:"1903 - 1972", h:"Teoria · capitolo 6", w:"Psichiatra britannico, tra i fondatori della cibernetica, la scienza del controllo e del feedback.", i:"Legge della varietà necessaria: solo la varietà assorbe la varietà. La capacità di rispondere deve stare dove arrivano le situazioni, al confine.", s:"Slide 6, 10 e 11"},
{id:"n5", n:"Stafford Beer", y:"1926 - 2002", h:"Teoria · capitolo 6", w:"Pensatore britannico del management che ha applicato la cibernetica alle organizzazioni.", i:"Viable System Model: un'organizzazione viva ha bisogno di unità con autonomia operativa più una coordinazione del tutto. In IBM Svizzera domina la coordinazione.", s:"Slide 6 e 11"},
{id:"n6", n:"Tom Burns e G. M. Stalker", y:"1961", h:"Teoria · contingenza", w:"Ricercatori britannici che hanno studiato come le aziende affrontano il cambiamento tecnologico.", i:"Organizzazioni meccanicistiche contro organiche: la gerarchia rigida va bene in un mondo stabile, i ruoli flessibili in un mondo che cambia. Le etichette dei nostri strati vengono da loro.", s:"Slide 4"},
{id:"n7", n:"Edgar Schein", y:"1928 - 2023", h:"Teoria · capitolo 7", w:"Professore al MIT, l'autore classico sulla cultura organizzativa.", i:"Tre livelli della cultura: artefatti, valori dichiarati, presupposti di fondo. Il quadro della nostra slide sulla cultura.", s:"Slide 8"},
{id:"n8", n:"Amy Edmondson", y:"nata nel 1959", h:"Teoria · capitolo 7", w:"Professoressa alla Harvard Business School.", i:"Sicurezza psicologica: poter ammettere errori, chiedere e dissentire senza paura. In IBM dipende dal manager, per questo la Raccomandazione 2 forma i manager.", s:"Slide 8 e 12"},
{id:"n9", n:"Paul Lawrence e Jay Lorsch", y:"1967", h:"Teoria · contingenza", w:"Ricercatori di Harvard che hanno studiato come si organizzano le aziende in ambienti diversi.", i:"La differenziazione crea il bisogno di integrazione. Più strati vogliono dire più parti diverse, quindi più bisogno delle persone che le collegano. È il nome della nostra tesi.", s:"Slide 3, 7 e 10"}
];

P2.es=[
{id:"e1", t:"Capítulo 1 · Cuatro tipos de verdad",
 p:["En la Parte 1 escuchaste una historia. Ahora la compruebas. A partir de aquí, cada frase de nuestra presentación lleva una pequeña etiqueta que dice de dónde viene.",
 "<b>FACT</b>: escrito en una fuente pública oficial, como el informe anual de IBM o un comunicado de prensa. <b>FINDING</b>: oído en nuestra entrevista con alguien de dentro de IBM. <b>INTERPRETATION</b>: una conclusión nuestra, tras aplicar una teoría del curso. <b>ASSUMPTION</b>: algo que creemos, pero que todavía no podemos demostrar.",
 "Mira otra vez el misterio. La frase del director ejecutivo, <q>We did not adapt and move quickly enough</q>, viene de una carta que IBM publicó el 14 de julio de 2026. Es un FACT. La respuesta <q>We are pretty good in speed</q> viene de nuestra entrevista del 14 de octubre de 2026. Es un FINDING. Nuestra afirmación de que ambas son ciertas a la vez es una INTERPRETATION.",
 "Por qué importa: la regla del curso dice que lo que produce una IA nunca es una prueba, y la nota premia las pruebas. Una etiqueta en cada afirmación muestra al público, y al profesor, que sabes distinguir entre lo que has visto y lo que piensas."],
 task:"Toma tres frases cualesquiera de la Parte 1 y dale a cada una una etiqueta (FACT, FINDING, INTERPRETATION o ASSUMPTION). Explica cada elección en una línea."},
{id:"e2", t:"Capítulo 2 · La empresa en cifras",
 p:["IBM, International Business Machines, se fundó en 1911 y tiene su sede en Armonk, cerca de Nueva York.",
 "En 2025 sus ingresos fueron de <b>67.500 millones de dólares</b> (informe anual de IBM 2025). Cerca del 44% vino del software, el 31% de la consultoría y el 23% de la infraestructura. Más del 80% de los ingresos viene de clientes que compran a las tres partes a la vez, según la propia carta del presidente en ese informe. Es el detalle que la Parte 1 te pidió recordar.",
 "IBM dice de sus mainframes que los prefieren 44 de los 50 bancos más grandes del mundo. Es una afirmación de la propia IBM, así que en una diapositiva escribimos: <i>según IBM</i>.",
 "Su propósito, con sus palabras: <q>IBM aspires to be the catalyst that makes the world work better.</q> Y su lema más antiguo es una sola palabra: THINK.",
 "Una lección de verificación. La persona entrevistada dijo que el laboratorio suizo tiene <q>six or seven</q> premios Nobel. La página de historia del laboratorio dice dos, en Física, en 1986 y 1987. También quien trabaja dentro puede equivocarse con los datos. Los findings te dicen cómo funcionan las cosas. Los hechos los compruebas en la fuente.",
 "Quién quiere qué, y con qué reloj. Los <b>accionistas</b> quieren resultados cada trimestre, y pueden vender sus acciones en un día. Los <b>clientes</b> quieren soluciones a medida que duran años. Los <b>empleados</b> quieren espacio para hacer bien su trabajo, y después de julio de 2026 sintieron <q>way more pressure from the top</q>. Tres expectativas que tiran en direcciones distintas, con tres relojes distintos: un trimestre, varios años, cada día de trabajo."],
 task:"¿Qué cifra de este capítulo pondrías en la diapositiva de Dirección, y por qué esa? Después explica en dos frases por qué no usamos el número de Nobel de la entrevista."},
{id:"e3", t:"Capítulo 3 · Los pisos de la casa, con fechas",
 p:["En la Parte 1 la casa crecía piso a piso. Estos son los pisos reales.",
 "<b>Años 1910</b>: Thomas J. Watson Sr. acuña THINK. Una empresa clásica: jerarquía clara, normas, orden.",
 "<b>1993</b>: IBM pierde unos 8.100 millones de dólares, una de las mayores pérdidas de la historia empresarial. Sobre la mesa está el plan de dividirla en empresas independientes. El nuevo director ejecutivo, Lou Gerstner, detiene el plan. Con sus palabras: <q>In 1993 we made a very important decision to keep the company together.</q> IBM se convierte en una empresa integrada.",
 "<b>Desde 2013</b>: el Enterprise Design Thinking extiende por IBM equipos ágiles guiados por el diseño.",
 "<b>2019</b>: IBM compra Red Hat, una empresa de software de código abierto, por unos 34.000 millones de dólares. <b>2021</b>: separa su negocio de servicios de infraestructura, que se convierte en una empresa independiente llamada Kyndryl.",
 "Ninguno de estos pasos sustituyó al anterior. La jerarquía sigue ahí. La integración sigue ahí. Los equipos ágiles están encima. El ecosistema de empresas compradas y separadas está alrededor. Eso es lo que queremos decir con capas, no sustituciones.",
 "Una precaución: esta historia viene de fuentes de IBM y del propio Gerstner. Nuestra entrevista no dice nada de ella. Por eso tiene una sola diapositiva."],
 task:"¿Por qué importa que no se quitara ninguna capa? Explícalo con una consecuencia concreta que viste en la Parte 1."},
{id:"e4", t:"Capítulo 4 · La escalera, con palabras de dentro",
 p:["Estas son las palabras exactas detrás del Capítulo 3 de la Parte 1. Léelas despacio: en la diapositiva 6 las citarás.",
 "Sobre la forma: <q>if you look at the org chart for IBM, it's super tall.</q> Sobre por qué se agrupan los países: <q>it's a way to facilitate coordination and control</q>, porque <q>the general strategy or how we should work in the different countries comes from the top.</q>",
 "Sobre Suiza dentro de DACH: <q>since DACH is led through Germany, it's of course easy to assume that it's the same as Germany, but it isn't.</q> Las diferencias nombradas: el sistema político, <q>how we value security</q> y <q>we are a country of banks</q>.",
 "Sobre la velocidad: <q>if it's of relevance for global, it goes rather fast, if it's just a Swiss need you need to go through the rows.</q> Sobre más personal: si el nivel regional dice que no, <q>we will not ask</q> al director ejecutivo. <q>So it's done.</q>",
 "Y ahora la parte que todos olvidan. La regla de la velocidad se presentó con <q>that's my opinion, a rule of thumb</q>, con el añadido <q>sometimes you can jump it</q>, y que se puede llamar a alguien más arriba si <q>you are really sure why you are calling them</q>.",
 "En la diapositiva queda así: FINDING, regla práctica de quien trabaja dentro. Quitar la cautela convertiría una opinión en un hecho. Esa persona estará en la sala, y lo notará."],
 task:"Escribe la frase que dirías en voz alta en la diapositiva 6 sobre la escalera, con la cautela incluida. Después escribe por qué la cautela te hace más creíble, no menos."},
{id:"e5", t:"Capítulo 5 · Las personas y la cultura, con sus palabras",
 p:["Detrás del Capítulo 2 de la Parte 1: durante la contratación se insistió mucho en hacer red, y los cafés mostraron <q>the power dynamics in the company, in the departments which were closest to me</q>. Después: <q>that is invisible in the org chart, right? You have certain managers which have been there for 20 years. They have way more influence than the others, even though they are on the same level.</q> Comprobamos esta frase en tres transcripciones: la palabra es <i>invisible</i>.",
 "Detrás del Capítulo 4: <q>we have five people</q>, los deal makers, que <q>work across different brands, across different offerings, across different segmentations</q> y <q>help, usually in these cases, to find a way</q>. Probablemente un equipo suizo: dilo. Y la oferta: <q>It's not graspable. Also as an employee it's not graspable.</q> Pero también: <q>that also helps to be adaptable to the environment. Pros and cons.</q>",
 "Detrás del Capítulo 5: <q>We experienced way more pressure from the top</q> y <q>It's a joint adventure</q>. El lema: <q>speed over perfection</q>, <q>really pushed also from the top</q>. La seguridad: <q>it also highly depends which manager</q>, y con un gran contrato perdido <q>you will feel it</q>. La libertad: <q>if you perform well, you have quite a lot of freedom</q> y <q>as long as you perform, it's fine</q>."],
 task:"Elige las tres citas de este capítulo que más querrías defender en las preguntas después de la presentación. Para cada una, di en una línea qué demuestra."},
{id:"e6", t:"Capítulo 6 · ¿Cuánto podemos fiarnos?",
 p:["Todos nuestros findings vienen de una sola persona, que estudia y trabaja en IBM desde hace un año, en la unidad de apoyo del director general de IBM Suiza, y que además es nuestro profesor.",
 "Esa posición tiene dos caras. Es una vista amplia: cerca de la cima de la organización suiza, en contacto con muchos departamentos. Pero es una sola vista, desde un solo lugar, y puede influir en lo que se eligió decir.",
 "Nuestros datos llegan hasta el segundo trimestre de 2026. IBM publica los resultados del tercer trimestre el 21 de octubre a las 17:00, hora de Nueva York, pocas horas después de nuestra presentación. Si alguien lo pregunta, lo decimos.",
 "Nombrar los límites no es una debilidad. Es lo que el curso llama separar pruebas de suposiciones, y forma parte de un diagnóstico bien fundado."],
 task:"Alguien del público pregunta: ¿cómo sabéis que esto vale para toda IBM y no solo para una persona en Zúrich? Escribe tu respuesta en cuatro o cinco frases."}
];

P3.es=[
{id:"a1", t:"Capítulo 1 · Etiquetar o explicar",
 p:["Ya conoces la historia y las pruebas. La Parte 3 te da las herramientas que usa el curso para explicarlas.",
 "Primero, la distinción más importante para la nota. <b>Etiquetar</b> es decir: IBM es una matriz. <b>Explicar</b> es decir: IBM vende con tres unidades al mismo cliente, así que alguien tiene que decidir quién lidera, y ahí es donde se frena. Mismos hechos. La segunda frase usa la teoría para mostrar un mecanismo, una causa y un efecto.",
 "Nuestro marco viene del capítulo 6 del curso: el <b>Organizational Viability Framework</b>. Una organización sigue siendo viable cuando tres cosas encajan: <b>Dirección</b> (propósito, estrategia), <b>Estructura</b> (roles, procesos, derechos de decisión) y <b>Personas</b> (motivación, cultura, relaciones).",
 "Dentro del triángulo hay tres tensiones, y una organización viable gestiona los dos extremos de cada una en lugar de elegir uno: <b>ambidestreza</b>, explorar lo nuevo frente a explotar lo que funciona hoy; <b>adaptabilidad</b>, transformarse frente a mantenerse estable; <b>coherencia</b>, autonomía frente a control.",
 "Toda la presentación recorre este triángulo, esquina por esquina, y termina en las tensiones."],
 task:"Escribe una frase sobre IBM que solo etiquete, y después reescríbela para que explique. Usa algo de la Parte 1 o 2."},
{id:"a2", t:"Capítulo 2 · No hay una única mejor manera",
 p:["La teoría de la contingencia dice que no hay una única mejor manera de organizarse. La estructura adecuada depende del entorno.",
 "Tom Burns y G. M. Stalker le dieron dos palabras clásicas. Una organización <b>mecanicista</b> tiene jerarquía estricta y reglas fijas: funciona en un entorno estable. Una organización <b>orgánica</b> tiene roles flexibles y comunicación lateral: funciona cuando las cosas cambian rápido.",
 "Paul Lawrence y Jay Lorsch añadieron la idea que mejor encaja con nuestra tesis. Cuanto más distintas tienen que ser las partes de una organización, cada una ajustada a su mercado, más <b>diferenciación</b> hay. Y cuanta más diferenciación, más necesita la organización <b>integración</b>: personas y mecanismos que hacen trabajar juntas a las partes distintas. Más capas significan más diferenciación, por tanto más necesidad de integración, y la fricción aparece justo donde la integración es débil: en las juntas.",
 "Nuestras capas son contingencia en acción. Cada piso de la casa respondió a un entorno nuevo: la jerarquía para un mercado estable, la integración para clientes que querían una sola solución, los equipos ágiles para el software y la velocidad, el ecosistema para la IA y el código abierto.",
 "También explica algo que parece una debilidad. Sobre los competidores nos dijeron: <q>in all the different offerings we have, we have a bit different competitors.</q> Cada negocio se enfrenta a su propio mercado, así que tener unidades separadas tiene sentido. Por eso no recomendamos fusionarlas.",
 "Punto ciego: la contingencia explica el encaje con el entorno, pero dice poco sobre el poder y la política interna."],
 task:"Con la teoría de la contingencia, explica por qué IBM sigue dividida en negocios separados aunque sus clientes compren de todos a la vez."},
{id:"a3", t:"Capítulo 3 · Solo la variedad absorbe la variedad",
 p:["La <b>ley de la variedad requerida</b> de W. Ross Ashby: para manejar una situación, un sistema necesita al menos tantas respuestas posibles como variaciones tiene la situación. Solo la variedad absorbe la variedad.",
 "Piensa en un portero que solo sabe hacer un tipo de parada. Cualquier otro tiro es gol. Cuantos más tipos de tiro, más tipos de parada hacen falta, y hacen falta donde llegan los tiros, no en una oficina lejana.",
 "IBM en conjunto tiene una variedad enorme: <q>we actually have nearly everything</q>. Eso es Ashby trabajando a favor de IBM, y también nos lo dijeron desde dentro: ayuda a IBM a adaptarse. Pero la capacidad de decidir está arriba en la escalera. En el borde suizo, donde llegan las situaciones locales, la variedad de decisiones disponibles es pequeña. Ahí está la fricción.",
 "Stafford Beer lo convirtió en el <b>Viable System Model</b>: una organización viable necesita unidades con verdadera autonomía operativa, más una coordinación que mantenga unido el conjunto. En IBM Suiza, la coordinación domina sobre la autonomía.",
 "Esta es la teoría detrás de la Recomendación 1: dar al país un margen definido de decisiones y poner un plazo a las escaladas.",
 "La Recomendación 1 en un par claro. <b>Beneficio</b>: respuestas más rápidas para los clientes suizos, y decisiones tomadas donde llegan las situaciones. <b>Riesgo</b>: menos coordinación y control, países que empiezan a decidir de forma distinta, y un centro que quizá no quiera ceder poder."],
 task:"Explica la Recomendación 1 con la ley de Ashby, con tus palabras, usando la palabra “variedad” como máximo una vez."},
{id:"a4", t:"Capítulo 4 · Los niveles invisibles",
 p:["Toda organización tiene un lado formal, el organigrama, y una <b>organización informal</b>: relaciones, confianza y reglas no escritas que deciden cómo se trabaja de verdad. Los dos mapas de la Parte 1.",
 "Edgar Schein describe la cultura en tres niveles. <b>Artefactos</b>: lo que ves y oyes, como el lema <q>speed over perfection</q>. <b>Valores declarados</b>: lo que la organización dice que valora, como THINK. <b>Supuestos de fondo</b>: lo que la gente cree sin decirlo. El nuestro, como interpretación: los resultados compran libertad, y los números del trimestre marcan el reloj.",
 "Cuando lo que se dice y lo que se premia no coinciden, hay una distancia entre los valores declarados y los practicados. Nuestra prueba: la seguridad <q>highly depends which manager</q>.",
 "Amy Edmondson llama <b>seguridad psicológica</b> a la sensación de poder admitir un error sin ser castigado. Nuestra persona entrevistada la tuvo, con un error pequeño. No con un gran contrato perdido.",
 "Esta es la teoría detrás de la Recomendación 2: apoyar a las personas que conectan, y formar a los jefes en seguridad psicológica, sin convertir lo informal en otra capa formal más.",
 "Un concepto del curso hace preciso el “no otra capa más”: las <b>comunidades de práctica</b>, grupos de personas que comparten un oficio y aprenden unas de otras a través del organigrama (el término viene de Jean Lave y Etienne Wenger). Apoyar una comunidad de vendedores y deal makers no es lo mismo que crear un departamento nuevo. La Recomendación 2 en un par claro. <b>Beneficio</b>: una integración que depende menos de a quién conoces, y más espacio para admitir errores. <b>Riesgo</b>: formalizar lo informal puede matarlo, y el efecto es difícil de medir."],
 task:"Explica por qué el supuesto de fondo de nuestra diapositiva de Schein está marcado como INTERPRETATION, y por qué es justo lo que Schein esperaría."},
{id:"a5", t:"Capítulo 5 · Dónde está IBM",
 p:["Ahora pon todo sobre el triángulo.",
 "<b>Ambidestreza</b>: IBM explora sobre todo comprando empresas y con sus laboratorios de investigación. Tras el verano de 2026 se inclinó hacia la explotación: recortes de presupuesto, objetivos trimestrales.",
 "<b>Adaptabilidad</b>: se transforma añadiendo capas, así que la estabilidad se acumula. Rápida por dentro, <q>not fast enough</q> para el mercado, en palabras de su director ejecutivo.",
 "<b>Coherencia</b>: autonomía condicionada a los resultados. Libertad si rindes, preguntas y presión central cuando caen los resultados.",
 "El control de viabilidad del curso: ¿IBM funciona hoy? Sí. ¿Sobrevive? Sí. ¿Se desarrolla para mañana? En riesgo. Lo último es un juicio nuestro, y lo etiquetamos como tal.",
 "Fortalezas y costes van juntos: la amplitud que hace a IBM adaptable es la misma amplitud que nadie consigue abarcar."],
 task:"Elige una de las tres tensiones y defiende dónde colocamos a IBM, usando un FACT y un FINDING."},
{id:"a6", t:"Capítulo 6 · El jefe final",
 p:["Después de la presentación hay cinco minutos de preguntas, y quien pregunte puede ser la misma persona que entrevistamos. Estas son cinco preguntas que podrían llegar.",
 "<b>1.</b> ¿El margen de decisión suizo no es simplemente una capa nueva, justo lo que decís que IBM debería evitar?",
 "<b>2.</b> Decís que la cadena frena a Suiza. ¿Cuál es el coste, en concreto?",
 "<b>3.</b> ¿Por qué lo llamáis un problema de viabilidad, si IBM es rentable y tiene más de cien años?",
 "<b>4.</b> Vuestro supuesto de fondo, los números del trimestre marcan el reloj: ¿dónde está la prueba?",
 "<b>5.</b> Si pudierais hacerme una pregunta más, ¿cuál sería?"],
 task:"Elige la pregunta más difícil para ti y escribe tu respuesta, como la dirías en la sala.",
 reveal:"Qué contiene una respuesta sólida. <b>1.</b> No: es un conjunto de derechos de decisión dentro del nivel de país que ya existe, no una caja nueva. Nombra con honestidad su coste. <b>2.</b> El ejemplo del personal y los contratos que se pasan al trimestre siguiente; di que la regla de la velocidad era una regla práctica personal. <b>3.</b> La viabilidad no es solo sobrevivir: funcionar hoy, sobrevivir y desarrollarse para mañana. La propia carta del director ejecutivo pone en duda lo tercero. <b>4.</b> Es una interpretación construida con findings: speed over perfection impulsado desde arriba, la presión tras el segundo trimestre, contratos que se pasan del cierre del trimestre. Di que es nuestra. <b>5.</b> Aprovéchala: pregunta cómo se tomarían de verdad las decisiones del margen suizo, y las preguntas se convierten en una conversación."}
];

{id:"n1", n:"Thomas J. Watson Sr.", y:"1874 - 1956", h:"Historia de IBM", w:"Dirigió desde 1914 la empresa que se convirtió en IBM y la hizo global.", i:"Acuñó el lema THINK en los años 1910. Es la capa más antigua de nuestra casa y uno de los valores declarados de la diapositiva de Schein.", s:"Diapositivas 4 y 8"},
{id:"n2", n:"Lou Gerstner", y:"nacido en 1942", h:"Historia de IBM", w:"Director ejecutivo de IBM de 1993 a 2002, llegado de fuera en la peor crisis de la empresa.", i:"En 1993 detuvo el plan de dividir IBM en empresas separadas: “we made a very important decision to keep the company together.” Es nuestra capa de integración.", s:"Diapositiva 4"},
{id:"n3", n:"Arvind Krishna", y:"director ejecutivo desde 2020", h:"IBM hoy", w:"El actual director ejecutivo y presidente de IBM.", i:"Autor de la carta de julio de 2026: “We did not adapt and move quickly enough.” La primera cita de la presentación.", s:"Diapositiva 2, y la cima de la escalera en la 6"},
{id:"n4", n:"W. Ross Ashby", y:"1903 - 1972", h:"Teoría · capítulo 6", w:"Psiquiatra británico, uno de los fundadores de la cibernética, la ciencia del control y la retroalimentación.", i:"Ley de la variedad requerida: solo la variedad absorbe la variedad. La capacidad de responder debe estar donde llegan las situaciones, en el borde.", s:"Diapositivas 6, 10 y 11"},
{id:"n5", n:"Stafford Beer", y:"1926 - 2002", h:"Teoría · capítulo 6", w:"Pensador británico de la gestión que aplicó la cibernética a las organizaciones.", i:"Viable System Model: una organización viable necesita unidades con autonomía operativa más coordinación del conjunto. En IBM Suiza domina la coordinación.", s:"Diapositivas 6 y 11"},
{id:"n6", n:"Tom Burns y G. M. Stalker", y:"1961", h:"Teoría · contingencia", w:"Investigadores británicos que estudiaron cómo afrontan las empresas el cambio tecnológico.", i:"Organizaciones mecanicistas frente a orgánicas: la jerarquía estricta sirve en un mundo estable, los roles flexibles en un mundo que cambia. Las etiquetas de nuestras capas vienen de ellos.", s:"Diapositiva 4"},
{id:"n7", n:"Edgar Schein", y:"1928 - 2023", h:"Teoría · capítulo 7", w:"Profesor del MIT, el autor clásico sobre cultura organizacional.", i:"Tres niveles de cultura: artefactos, valores declarados, supuestos de fondo. El marco de nuestra diapositiva de cultura.", s:"Diapositiva 8"},
{id:"n8", n:"Amy Edmondson", y:"nacida en 1959", h:"Teoría · capítulo 7", w:"Profesora de la Harvard Business School.", i:"Seguridad psicológica: poder admitir errores, preguntar y discrepar sin miedo. En IBM depende del jefe, por eso la Recomendación 2 forma a los jefes.", s:"Diapositivas 8 y 12"},
{id:"n9", n:"Paul Lawrence y Jay Lorsch", y:"1967", h:"Teoría · contingencia", w:"Investigadores de Harvard que estudiaron cómo se organizan las empresas en entornos distintos.", i:"La diferenciación crea la necesidad de integración. Más capas significan más partes distintas, por tanto más necesidad de las personas que las conectan. Es el nombre de nuestra tesis.", s:"Diapositivas 3, 7 y 10"}
];

P2.hr=[
{id:"e1", t:"1. poglavlje · Četiri vrste istine",
 p:["U 1. dijelu čuo/la si priču. Sad je provjeravaš. Od sada svaka rečenica naše prezentacije nosi malu oznaku koja kaže odakle dolazi.",
 "<b>FACT</b>: zapisano u službenom javnom izvoru, poput IBM-ova godišnjeg izvješća ili priopćenja za medije. <b>FINDING</b>: čuto u našem intervjuu s nekim iz IBM-a. <b>INTERPRETATION</b>: naš vlastiti zaključak, nakon primjene teorije iz kolegija. <b>ASSUMPTION</b>: nešto u što vjerujemo, ali još ne možemo dokazati.",
 "Pogledaj ponovno misterij. Rečenica glavnog direktora, <q>We did not adapt and move quickly enough</q>, dolazi iz pisma koje je IBM objavio 14. srpnja 2026. To je FACT. Odgovor <q>We are pretty good in speed</q> dolazi iz našeg intervjua od 14. listopada 2026. To je FINDING. Naša tvrdnja da su oba istinita u isto vrijeme je INTERPRETATION.",
 "Zašto je to važno: pravilo kolegija kaže da ono što proizvede AI nikad nije dokaz, a ocjena nagrađuje dokaze. Oznaka na svakoj tvrdnji pokazuje publici, i predavaču, da razlikuješ ono što si vidio/la od onoga što misliš."],
 task:"Uzmi bilo koje tri rečenice iz 1. dijela i svakoj daj oznaku (FACT, FINDING, INTERPRETATION ili ASSUMPTION). Objasni svaki izbor u jednom retku."},
{id:"e2", t:"2. poglavlje · Tvrtka u brojkama",
 p:["IBM, International Business Machines, osnovan je 1911. i ima sjedište u Armonku, blizu New Yorka.",
 "U 2025. prihodi su mu bili <b>67,5 milijardi dolara</b> (IBM-ovo godišnje izvješće za 2025.). Otprilike 44% od softvera, 31% od savjetovanja i 23% od infrastrukture. Više od 80% prihoda dolazi od klijenata koji kupuju od sva tri dijela odjednom, prema pismu predsjednika u istom izvješću. To je detalj koji je 1. dio tražio da zapamtiš.",
 "IBM za svoje mainframe računale kaže da ih preferira 44 od 50 najvećih banaka na svijetu. To je tvrdnja samog IBM-a, pa na slajdu pišemo: <i>prema IBM-u</i>.",
 "Njegova svrha, njegovim riječima: <q>IBM aspires to be the catalyst that makes the world work better.</q> A najstariji moto mu je jedna riječ: THINK.",
 "Lekcija o provjeravanju. Osoba iz intervjua rekla je da švicarski laboratorij ima <q>six or seven</q> Nobelovih nagrada. Povijesna stranica laboratorija kaže dvije, iz fizike, 1986. i 1987. I ljudi iznutra mogu pogriješiti u činjenicama. Findings ti govore kako stvari funkcioniraju. Činjenice ipak provjeravaš na izvoru.",
 "Tko što želi, i po kojem satu. <b>Dioničari</b> žele rezultate svakog tromjesečja i mogu prodati dionice u jednom danu. <b>Klijenti</b> žele rješenja po mjeri koja traju godinama. <b>Zaposlenici</b> žele prostor za dobar rad, a nakon srpnja 2026. osjetili su <q>way more pressure from the top</q>. Tri očekivanja koja vuku na različite strane, po tri različita sata: tromjesečje, nekoliko godina, svaki radni dan."],
 task:"Koju bi jednu brojku iz ovog poglavlja stavio/la na slajd o smjeru, i zašto baš nju? Zatim u dvije rečenice objasni zašto ne koristimo broj Nobelovih nagrada iz intervjua."},
{id:"e3", t:"3. poglavlje · Katovi kuće, s datumima",
 p:["U 1. dijelu kuća je rasla kat po kat. Evo pravih katova.",
 "<b>1910-e</b>: Thomas J. Watson Sr. smišlja THINK. Klasična tvrtka: jasna hijerarhija, pravila, red.",
 "<b>1993.</b>: IBM gubi oko 8,1 milijardu dolara, jedan od najvećih gubitaka u povijesti poduzeća. Na stolu je plan da se podijeli na neovisne tvrtke. Novi glavni direktor, Lou Gerstner, zaustavlja plan. Njegovim riječima: <q>In 1993 we made a very important decision to keep the company together.</q> IBM postaje jedna integrirana tvrtka.",
 "<b>Od 2013.</b>: Enterprise Design Thinking širi IBM-om agilne timove vođene dizajnom.",
 "<b>2019.</b>: IBM kupuje Red Hat, tvrtku za softver otvorenog koda, za oko 34 milijarde dolara. <b>2021.</b>: izdvaja poslovanje infrastrukturnih usluga, koje postaje neovisna tvrtka Kyndryl.",
 "Nijedan od ovih koraka nije zamijenio prethodni. Hijerarhija je još tu. Integracija je još tu. Agilni timovi su na vrhu. Ekosustav kupljenih i izdvojenih tvrtki je oko njih. To mislimo kad kažemo slojevi, a ne zamjene.",
 "Jedan oprez: ova povijest dolazi iz IBM-ovih izvora i od samog Gerstnera. Naš intervju o njoj ništa ne govori. Zato ima samo jedan slajd."],
 task:"Zašto je važno da nijedan sloj nije uklonjen? Objasni to jednom konkretnom posljedicom koju si vidio/la u 1. dijelu."},
{id:"e4", t:"4. poglavlje · Ljestve, riječima iznutra",
 p:["Evo točnih riječi iza 3. poglavlja 1. dijela. Čitaj ih polako: na slajdu 6 ćeš ih citirati.",
 "O obliku: <q>if you look at the org chart for IBM, it's super tall.</q> O tome zašto se države grupiraju: <q>it's a way to facilitate coordination and control</q>, jer <q>the general strategy or how we should work in the different countries comes from the top.</q>",
 "O Švicarskoj unutar DACH-a: <q>since DACH is led through Germany, it's of course easy to assume that it's the same as Germany, but it isn't.</q> Navedene razlike: politički sustav, <q>how we value security</q> i <q>we are a country of banks</q>.",
 "O brzini: <q>if it's of relevance for global, it goes rather fast, if it's just a Swiss need you need to go through the rows.</q> O dodatnom osoblju: ako regionalna razina kaže ne, <q>we will not ask</q> glavnog direktora. <q>So it's done.</q>",
 "A sad dio koji svi zaborave. Pravilo o brzini uvedeno je riječima <q>that's my opinion, a rule of thumb</q>, uz dodatak <q>sometimes you can jump it</q>, i da se može nazvati nekoga više ako <q>you are really sure why you are calling them</q>.",
 "Na slajdu to postaje: FINDING, pravilo iz iskustva osobe iznutra. Izostaviti ogradu pretvorilo bi mišljenje u činjenicu. Ta će osoba biti u dvorani i primijetit će."],
 task:"Napiši rečenicu koju bi naglas rekao/la na slajdu 6 o ljestvama, s uključenom ogradom. Zatim napiši zašto te ograda čini vjerodostojnijim/om, a ne manje."},
{id:"e5", t:"5. poglavlje · Ljudi i kultura, njihovim riječima",
 p:["Iza 2. poglavlja 1. dijela: pri zapošljavanju se jako poticalo umrežavanje, a kave su pokazale <q>the power dynamics in the company, in the departments which were closest to me</q>. Zatim: <q>that is invisible in the org chart, right? You have certain managers which have been there for 20 years. They have way more influence than the others, even though they are on the same level.</q> Ovu smo rečenicu provjerili na tri transkripcije: riječ je <i>invisible</i>.",
 "Iza 4. poglavlja: <q>we have five people</q>, deal makeri, koji <q>work across different brands, across different offerings, across different segmentations</q> i <q>help, usually in these cases, to find a way</q>. Vjerojatno švicarski tim: reci to. I ponuda: <q>It's not graspable. Also as an employee it's not graspable.</q> Ali i: <q>that also helps to be adaptable to the environment. Pros and cons.</q>",
 "Iza 5. poglavlja: <q>We experienced way more pressure from the top</q> i <q>It's a joint adventure</q>. Slogan: <q>speed over perfection</q>, <q>really pushed also from the top</q>. Sigurnost: <q>it also highly depends which manager</q>, a s izgubljenim velikim poslom <q>you will feel it</q>. Sloboda: <q>if you perform well, you have quite a lot of freedom</q> i <q>as long as you perform, it's fine</q>."],
 task:"Odaberi tri citata iz ovog poglavlja koja bi najradije branio/la u pitanjima nakon prezentacije. Za svaki u jednom retku reci što dokazuje."},
{id:"e6", t:"6. poglavlje · Koliko možemo vjerovati?",
 p:["Svi naši findings dolaze od jedne osobe, koja studira i radi u IBM-u oko godinu dana, u jedinici podrške glavnog direktora IBM-a Švicarska, i koja nam je ujedno predavač.",
 "Taj položaj ima dvije strane. To je širok pogled: blizu vrha švicarske organizacije, u kontaktu s mnogim odjelima. Ali to je jedan pogled, s jednog mjesta, i može utjecati na ono što je odabrano da se kaže.",
 "Naši podaci završavaju s drugim tromjesečjem 2026. IBM objavljuje rezultate trećeg tromjesečja 21. listopada u 17:00 po njujorškom vremenu, nekoliko sati nakon naše prezentacije. Ako netko pita, reći ćemo to.",
 "Imenovati ograničenja nije slabost. To kolegij zove odvajanjem dokaza od pretpostavki, i dio je dobro utemeljene dijagnoze."],
 task:"Netko iz publike pita: kako znate da to vrijedi za cijeli IBM, a ne samo za jednu osobu u Zürichu? Napiši svoj odgovor u četiri ili pet rečenica."}
];

P3.hr=[
{id:"a1", t:"1. poglavlje · Etiketirati ili objasniti",
 p:["Sad poznaješ priču i dokaze. 3. dio daje ti alate kojima ih kolegij objašnjava.",
 "Prvo, najvažnija razlika za ocjenu. <b>Etiketirati</b> znači reći: IBM je matrica. <b>Objasniti</b> znači reći: IBM prodaje kroz tri jedinice istom klijentu, pa netko mora odlučiti tko vodi, i tu se usporava. Iste činjenice. Druga rečenica koristi teoriju da pokaže mehanizam, uzrok i posljedicu.",
 "Naš okvir dolazi iz 6. poglavlja kolegija: <b>Organizational Viability Framework</b>. Organizacija ostaje održiva kad se tri stvari uklapaju: <b>smjer</b> (svrha, strategija), <b>struktura</b> (uloge, procesi, prava odlučivanja) i <b>ljudi</b> (motivacija, kultura, odnosi).",
 "Unutar trokuta su tri napetosti, a održiva organizacija upravlja objema krajnostima svake umjesto da bira jednu: <b>ambideksternost</b>, istraživati novo nasuprot iskorištavanju onoga što danas radi; <b>prilagodljivost</b>, mijenjati se nasuprot ostati stabilan; <b>koherentnost</b>, autonomija nasuprot kontroli.",
 "Cijela prezentacija prolazi ovaj trokut, kut po kut, i završava na napetostima."],
 task:"Napiši jednu rečenicu o IBM-u koja samo etiketira, a zatim je preradi tako da objašnjava. Upotrijebi nešto iz 1. ili 2. dijela."},
{id:"a2", t:"2. poglavlje · Nema jednog najboljeg načina",
 p:["Teorija kontingencije kaže da ne postoji jedan najbolji način organiziranja. Prava struktura ovisi o okolini.",
 "Tom Burns i G. M. Stalker dali su joj dvije klasične riječi. <b>Mehanicistička</b> organizacija ima strogu hijerarhiju i fiksna pravila: radi u stabilnoj okolini. <b>Organska</b> organizacija ima fleksibilne uloge i bočnu komunikaciju: radi kad se stvari brzo mijenjaju.",
 "Paul Lawrence i Jay Lorsch dodali su ideju koja najbolje odgovara našoj tezi. Što se dijelovi organizacije moraju više razlikovati, svaki prilagođen svom tržištu, to je više <b>diferencijacije</b>. A što je više diferencijacije, to organizaciji više treba <b>integracija</b>: ljudi i mehanizmi koji tjeraju različite dijelove da rade zajedno. Više slojeva znači više diferencijacije, dakle veću potrebu za integracijom, a trenje se pojavljuje upravo gdje je integracija slaba: na spojevima.",
 "Naši slojevi su kontingencija na djelu. Svaki kat kuće odgovorio je na novu okolinu: hijerarhija za stabilno tržište, integracija za klijente koji su htjeli jedno rješenje, agilni timovi za softver i brzinu, ekosustav za AI i otvoreni kod.",
 "Objašnjava i nešto što izgleda kao slabost. O konkurentima nam je rečeno: <q>in all the different offerings we have, we have a bit different competitors.</q> Svako poslovanje ima svoje tržište, pa odvojene jedinice imaju smisla. Zato ne preporučujemo njihovo spajanje.",
 "Slijepa točka: kontingencija objašnjava usklađenost s okolinom, ali malo govori o moći i unutarnjoj politici."],
 task:"Teorijom kontingencije objasni zašto IBM ostaje podijeljen na odvojena poslovanja iako njegovi klijenti kupuju od svih odjednom."},
{id:"a3", t:"3. poglavlje · Samo raznolikost apsorbira raznolikost",
 p:["<b>Zakon potrebne raznolikosti</b> W. Rossa Ashbyja: da bi se nosio sa situacijom, sustav treba barem onoliko mogućih odgovora koliko situacija ima varijacija. Samo raznolikost apsorbira raznolikost.",
 "Zamisli vratara koji zna samo jednu vrstu obrane. Svaki drugi udarac je gol. Što više vrsta udaraca, to više vrsta obrana treba, i trebaju tamo gdje udarci dolaze, a ne u dalekom uredu.",
 "IBM kao cjelina ima ogromnu raznolikost: <q>we actually have nearly everything</q>. To je Ashby u korist IBM-a, a i iznutra su nam to rekli: pomaže IBM-u da se prilagodi. Ali sposobnost odlučivanja je visoko na ljestvama. Na švicarskom rubu, gdje stižu lokalne situacije, raznolikost dostupnih odluka je mala. To je trenje.",
 "Stafford Beer pretvorio je to u <b>Viable System Model</b>: održiva organizacija treba jedinice sa stvarnom operativnom autonomijom, plus koordinaciju koja drži cjelinu na okupu. U IBM-u Švicarska koordinacija prevladava nad autonomijom.",
 "To je teorija iza Preporuke 1: dati državi određeni okvir odluka i postaviti rok za eskalacije.",
 "Preporuka 1 kao jasan par. <b>Korist</b>: brži odgovori švicarskim klijentima i odluke donesene tamo gdje situacije stižu. <b>Rizik</b>: manje koordinacije i kontrole, države koje počnu odlučivati različito, i centar koji možda ne želi prepustiti moć."],
 task:"Objasni Preporuku 1 Ashbyjevim zakonom, svojim riječima, koristeći riječ “raznolikost” najviše jednom."},
{id:"a4", t:"4. poglavlje · Nevidljive razine",
 p:["Svaka organizacija ima formalnu stranu, organigram, i <b>neformalnu organizaciju</b>: odnose, povjerenje i nepisana pravila koja odlučuju kako se posao stvarno radi. Dvije karte iz 1. dijela.",
 "Edgar Schein opisuje kulturu na tri razine. <b>Artefakti</b>: ono što vidiš i čuješ, poput slogana <q>speed over perfection</q>. <b>Deklarirane vrijednosti</b>: ono što organizacija kaže da cijeni, poput THINK. <b>Temeljne pretpostavke</b>: ono u što ljudi vjeruju a da to ne kažu. Naša, kao tumačenje: rezultati kupuju slobodu, a tromjesečne brojke određuju sat.",
 "Kad se ono što se govori i ono što se nagrađuje ne poklapa, postoji jaz između deklariranih i stvarno prakticiranih vrijednosti. Naš dokaz: sigurnost <q>highly depends which manager</q>.",
 "Amy Edmondson osjećaj da možeš priznati pogrešku a da ne budeš kažnjen/a zove <b>psihološkom sigurnošću</b>. Osoba iz intervjua imala ju je, s malom pogreškom. Ne s velikim izgubljenim poslom.",
 "To je teorija iza Preporuke 2: podržati ljude koji povezuju i educirati menadžere o psihološkoj sigurnosti, bez pretvaranja neformalnog u još jedan formalni sloj.",
 "Jedan pojam iz kolegija čini “ne još jedan sloj” preciznim: <b>zajednice prakse</b>, skupine ljudi koji dijele isti zanat i uče jedni od drugih preko organigrama (pojam dolazi od Jean Lave i Etiennea Wengera). Podržati zajednicu prodavača i deal makera nije isto što i stvoriti novi odjel. Preporuka 2 kao jasan par. <b>Korist</b>: integracija koja manje ovisi o tome koga poznaješ, i više prostora za priznavanje pogrešaka. <b>Rizik</b>: formaliziranje neformalnog može ga ubiti, a učinak je teško izmjeriti."],
 task:"Objasni zašto je temeljna pretpostavka na našem Scheinovom slajdu označena kao INTERPRETATION i zašto je to upravo ono što bi Schein očekivao."},
{id:"a5", t:"5. poglavlje · Gdje je IBM",
 p:["Sad sve stavi na trokut.",
 "<b>Ambideksternost</b>: IBM istražuje uglavnom kupujući tvrtke i kroz svoje istraživačke laboratorije. Nakon ljeta 2026. povučen je prema iskorištavanju: rezanje proračuna, tromjesečni ciljevi.",
 "<b>Prilagodljivost</b>: mijenja se dodavanjem slojeva, pa se stabilnost gomila. Brz iznutra, <q>not fast enough</q> za tržište, riječima glavnog direktora.",
 "<b>Koherentnost</b>: autonomija uz uvjet rezultata. Sloboda ako ostvaruješ, pitanja i središnji pritisak kad rezultati padnu.",
 "Provjera održivosti iz kolegija: funkcionira li IBM danas? Da. Preživljava li? Da. Razvija li se za sutra? U opasnosti. Ovo posljednje je naša procjena i tako je i označavamo.",
 "Snage i troškovi idu zajedno: širina koja IBM čini prilagodljivim ista je širina koju nitko ne može obuhvatiti."],
 task:"Odaberi jednu od tri napetosti i obrani gdje smo smjestili IBM, koristeći jedan FACT i jedan FINDING."},
{id:"a6", t:"6. poglavlje · Završni šef",
 p:["Nakon prezentacije slijedi pet minuta pitanja, a pitati može ista osoba s kojom smo vodili intervju. Evo pet pitanja koja bi mogla doći.",
 "<b>1.</b> Nije li švicarski okvir odlučivanja samo novi sloj, upravo ono što kažete da bi IBM trebao izbjegavati?",
 "<b>2.</b> Kažete da lanac usporava Švicarsku. Koliki je trošak, konkretno?",
 "<b>3.</b> Zašto to zovete problemom održivosti, ako je IBM profitabilan i star više od sto godina?",
 "<b>4.</b> Vaša temeljna pretpostavka, tromjesečne brojke određuju sat: gdje je dokaz?",
 "<b>5.</b> Kad biste mi mogli postaviti još jedno pitanje, koje bi to bilo?"],
 task:"Odaberi pitanje koje ti je najteže i napiši svoj odgovor, onako kako bi ga rekao/la u dvorani.",
 reveal:"Što sadrži dobar odgovor. <b>1.</b> Ne: to je skup prava odlučivanja unutar postojeće razine države, a ne nova kućica. Pošteno navedi njegovu cijenu. <b>2.</b> Primjer dodatnog osoblja i poslovi koji skliznu u sljedeće tromjesečje; reci da je pravilo o brzini bilo osobno pravilo iz iskustva. <b>3.</b> Održivost nije samo preživljavanje: funkcionirati danas, preživjeti i razvijati se za sutra. Pismo samog glavnog direktora dovodi u pitanje ovo treće. <b>4.</b> To je tumačenje izgrađeno na findings: speed over perfection guran odozgo, pritisak nakon drugog tromjesečja, poslovi koji prijeđu kraj tromjesečja. Reci da je naše. <b>5.</b> Iskoristi ga: pitaj kako bi se stvarno donosile odluke u švicarskom okviru, pa pitanja postanu razgovor."}
];

const MINW=25, NMIN=12;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=ls.get("hol-lang","en"); if(!UI[lang])lang="en";
let profile=null, st=null, view="start", db=null, syncState="local", saveTimer=null, choiceShown={};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const U=()=>UI[lang];
const words=s=>(s||"").trim().split(/\s+/).filter(Boolean).length;
const slugify=s=>s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const fresh=()=>({part:1,prog:{1:{ch:0,maxCh:0},2:{ch:0,maxCh:0},3:{ch:0,maxCh:0}},answers:{},choices:{},updatedAt:0});
function norm(s){if(!s.prog){s.prog={1:{ch:s.ch||0,maxCh:s.maxCh||0}}}for(const k of [1,2,3])if(!s.prog[k])s.prog[k]={ch:0,maxCh:0};if(!s.part)s.part=1;if(!s.answers)s.answers={};if(!s.choices)s.choices={};return s}

function langBar(){return `<div class="langs" role="group" aria-label="${U().lang}">${["en","it","es","hr"].map(l=>`<button class="pill" data-lang="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("")}</div>`}
function fill(s){return s.replaceAll("{N}",`<b>${esc(profile?profile.name:"")}</b>`)}

function render(){
  document.documentElement.lang=lang;
  if(view==="start")return renderStart();
  if(view==="parts")return renderParts();
  if(view==="read")return renderRead();
  if(view==="nb")return renderNb();
  if(view==="end")return renderEnd();
  if(view==="names")return renderNames();
}
function renderStart(){
  const u=U();
  app.innerHTML=`<div class="top"><span class="mono">OSP-1 · IBM · Group 2</span>${langBar()}</div>
  <h1>${u.title}</h1><p class="lede">${u.lede}</p>
  <form class="card" id="f" novalidate>
    <div class="mono">${u.enterT}</div>
    <div class="form">
      <div class="field"><label class="mono" for="nm">${u.name}</label><input id="nm" autocomplete="given-name" maxlength="40"></div>
      <div class="field"><label class="mono" for="pn">${u.pin}</label><input id="pn" inputmode="numeric" maxlength="8" type="password" autocomplete="off"></div>
    </div>
    <p class="err" id="er" hidden></p>
    <div class="row"><button class="btn primary" type="submit">${u.enter}</button></div>
    <p class="note">${u.pinNote}</p>
  </form>`;
  const last=ls.get("hol-last",null); if(last) document.getElementById("nm").value=last;
  document.getElementById("f").addEventListener("submit",async e=>{
    e.preventDefault();
    const name=document.getElementById("nm").value.trim(), pin=document.getElementById("pn").value.trim(), er=document.getElementById("er");
    er.hidden=true;
    if(name.length<2||!slugify(name)){er.textContent=u.errName;er.hidden=false;return}
    if(!/^\d{4,8}$/.test(pin)){er.textContent=u.errPin;er.hidden=false;return}
    const slug=slugify(name), ph=await hash("hol:"+slug+":"+pin);
    const local=ls.get("hol-p:"+slug,null);
    if(local&&local.pinHash!==ph){er.textContent=u.errWrong;er.hidden=false;return}
    let seed=null;
    if(!local){try{const r=await fetch("ibm-seed.json",{cache:"no-cache"});if(r.ok){const all=await r.json();seed=all[slug]||null}}catch(e){seed=null}}
    let remote=null;
    if(db){try{const snap=await db.doc("profiles/"+slug).get();remote=snap&&snap.exists?snap.data():null}catch(e){remote=null}}
    if(remote&&remote.pinHash&&remote.pinHash!==ph){er.textContent=u.errWrong;er.hidden=false;return}
    profile={slug,name,pinHash:ph};
    const a=local&&local.state||null, b=remote&&remote.state||null;
    st=norm((a&&b)?((a.updatedAt||0)>=(b.updatedAt||0)?a:b):(a||b||seed||fresh()));
    ls.set("hol-last",name); persist(true); view="parts"; render();
  });
}
function renderParts(){
  const u=U();
  app.innerHTML=`<div class="top"><span class="mono">${u.title}</span>${langBar()}</div>
  <h1>${fill(u.hello).replace(/<\/?b>/g,"")}</h1>
  <div class="parts">${u.parts.map((p,i)=>{const pr=st.prog[i+1],tot=PARTS[i+1][lang].length;const done=PARTS[i+1][lang].filter(c=>words(st.answers[c.id])>=MINW).length;return `<button class="part" data-part="${i+1}"><span class="num">${i+1}</span><span><b>${p[1]}</b><br>${p[2]}</span><span class="mono">${done}/${tot}</span></button>`}).join("")}
  <button class="part" data-names="1"><span class="num">#</span><span><b>${u.namesCard}</b><br>${u.namesCardD}</span><span class="mono">${NAMES[lang].filter(n=>words(st.answers[n.id])>=NMIN).length}/${NAMES[lang].length}</span></button></div>
  <div class="row"><button class="btn" id="nbB">${u.notebook}</button><button class="btn" id="swB">${u.switchP}</button><span class="sync" id="sy"></span></div>`;
  setSync();
  app.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{st.part=+b.dataset.part;persist();view="read";render();window.scrollTo(0,0)});
  app.querySelector("[data-names]").onclick=()=>{view="names";render();window.scrollTo(0,0)};
  document.getElementById("nbB").onclick=()=>{view="nb";render()};
  document.getElementById("swB").onclick=()=>{profile=null;st=null;view="start";render()};
}
function stepsBar(){
  const S=PARTS[st.part][lang], pr=st.prog[st.part];
  return `<div class="bar"><div class="steps">${S.map((c,i)=>`<button class="step${st.answers[c.id]&&words(st.answers[c.id])>=MINW?" done":""}" data-go="${i}" aria-current="${i===pr.ch}" ${i>pr.maxCh?"disabled":""} aria-label="${esc(c.t)}">${st.part===1?(i===0?"P":i):i+1}</button>`).join("")}</div><button class="btn" id="nbB" style="padding:5px 10px;font-size:13px">${U().notebook}</button></div>`;
}
function renderRead(){
  const u=U(), S=PARTS[st.part][lang], pr=st.prog[st.part], c=S[pr.ch];
  const chosen=st.choices[c.id];
  const hasChoice=!!c.choice;
  const showRest=!hasChoice||chosen!=null;
  const ans=st.answers[c.id]||"";
  const n=words(ans), ok=n>=MINW, last=pr.ch===S.length-1;
  app.innerHTML=`${stepsBar()}
  <article class="ch">
    <span class="mono">${u.title} · ${u.parts[st.part-1][0]}</span>
    <h2>${esc(c.t)}</h2>
    ${c.p.map(p=>`<p>${fill(p)}</p>`).join("")}
    ${hasChoice?`<div class="choice"><p class="q">${esc(c.choice.q)}</p>
      ${c.choice.o.map((o,i)=>`<button class="opt" data-opt="${i}" aria-pressed="${chosen===i}" ${chosen!=null?"disabled":""}>${esc(o)}</button>`).join("")}
      ${chosen!=null?`<p class="reply">${esc(c.choice.r[chosen])}</p>`:`<p class="note">${u.chooseFirst}</p>`}</div>`:""}
    ${showRest&&c.p2?c.p2.map(p=>`<p>${fill(p)}</p>`).join(""):""}
    ${showRest?`<div class="write">
      <span class="mono">${u.write}</span>
      <p class="q">${esc(c.task)}</p>
      <label for="ta" class="mono" style="position:absolute;left:-9999px">${esc(c.task)}</label>
      <textarea id="ta">${esc(ans)}</textarea>
      ${c.reveal?`<div class="keys" id="rv" ${ok?"":"hidden"}><p style="margin:0">${c.reveal}</p></div>`:""}
      <div class="row" style="justify-content:space-between"><span class="count${ok?" ok":""}" id="cnt">${u.minW.replace("{n}",n).replace("{m}",MINW)}</span><span class="sync" id="sy"></span></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="pv" ${pr.ch===0?"disabled":""}>← ${u.prev}</button>
      <button class="btn primary" id="nx" ${ok?"":"disabled"} title="${ok?"":u.unlock.replace("{m}",MINW)}">${last?u.finishP.replace("{p}",st.part):u.next} →</button>
    </div>`:""}
  </article>`;
  setSync();
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{pr.ch=+b.dataset.go;persist();render();window.scrollTo(0,0)});
  document.getElementById("nbB").onclick=()=>{view="nb";render();window.scrollTo(0,0)};
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{st.choices[c.id]=+b.dataset.opt;persist();render()});
  const ta=document.getElementById("ta");
  if(ta){ta.addEventListener("input",()=>{st.answers[c.id]=ta.value;const k=words(ta.value),good=k>=MINW;const cnt=document.getElementById("cnt");cnt.textContent=u.minW.replace("{n}",k).replace("{m}",MINW);cnt.classList.toggle("ok",good);document.getElementById("nx").disabled=!good;const rv=document.getElementById("rv");if(rv)rv.hidden=!good;persist()});
    document.getElementById("pv").onclick=()=>{pr.ch--;persist();render();window.scrollTo(0,0)};
    document.getElementById("nx").onclick=()=>{if(last){view="end";persist(true);render();window.scrollTo(0,0);return}pr.ch++;pr.maxCh=Math.max(pr.maxCh,pr.ch);persist(true);render();window.scrollTo(0,0)};}
}
function nbItems(){const u=U();const out=[];[1,2,3].forEach(p=>PARTS[p][lang].forEach(c=>{if(st.answers[c.id]&&st.answers[c.id].trim())out.push({k:`${u.partW} ${p} · ${c.t}`,q:c.task,a:st.answers[c.id]})}));NAMES[lang].forEach(n=>{if(st.answers[n.id]&&st.answers[n.id].trim())out.push({k:u.namesT,q:n.n,a:st.answers[n.id]})});return out}
function nbText(){return nbItems().map(x=>`${x.k}\n${x.q}\n\n${x.a.trim()}`).join("\n\n* * *\n\n")}
function renderNb(){
  const u=U(), items=nbItems();
  app.innerHTML=`<div class="top"><span class="mono">${u.title}</span>${langBar()}</div>
  <h1>${u.nbT}</h1><p class="lede">${u.nbLede}</p>
  <div class="nb">${items.length?items.map(x=>`<section><span class="mono">${esc(x.k)}</span><h3>${esc(x.q)}</h3><p>${esc(x.a)}</p></section>`).join(""):`<p class="note">${u.empty}</p>`}</div>
  <div class="row"><button class="btn primary" id="cp" ${items.length?"":"disabled"}>${u.copy}</button><button class="btn" id="bk">${u.back}</button><span class="note" id="cpm"></span></div>`;
  document.getElementById("bk").onclick=()=>{view="parts";render()};
  document.getElementById("cp").onclick=()=>{const t=nbText(),m=document.getElementById("cpm");
    navigator.clipboard.writeText(t).then(()=>{m.textContent=u.copied}).catch(()=>{m.textContent=u.copyFail;const s=app.querySelector(".nb");const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)})};
}
function renderNames(){
  const u=U();
  app.innerHTML=`<div class="top"><span class="mono">${u.title}</span>${langBar()}</div>
  <h1>${u.namesT}</h1><p class="lede">${u.namesLede}</p>
  <div class="nb">${NAMES[lang].map(n=>{const a=st.answers[n.id]||"",k=words(a),ok=k>=NMIN;return `<section class="card" style="border-left:4px solid var(--brick)">
    <span class="mono">${esc(n.h)} · ${esc(n.y)}</span><h3 style="font-size:22px">${esc(n.n)}</h3>
    <label class="mono" for="t-${n.id}">${u.namesWrite}</label>
    <textarea id="t-${n.id}" data-n="${n.id}" style="min-height:90px">${esc(a)}</textarea>
    <span class="count${ok?" ok":""}" id="c-${n.id}">${u.minW.replace("{n}",k).replace("{m}",NMIN)}</span>
    <div class="keys" id="r-${n.id}" ${ok?"":"hidden"}><p style="margin:0"><b>${u.who}:</b> ${esc(n.w)}</p><p style="margin:6px 0 0"><b>${u.idea}:</b> ${esc(n.i)}</p><p style="margin:6px 0 0"><b>${u.where}:</b> ${esc(n.s)}</p></div>
  </section>`}).join("")}</div>
  <div class="row"><button class="btn" id="bk">${u.back}</button><span class="sync" id="sy"></span></div>`;
  setSync();
  app.querySelectorAll("[data-n]").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.dataset.n;st.answers[id]=ta.value;const k=words(ta.value),ok=k>=NMIN;const c=document.getElementById("c-"+id);c.textContent=u.minW.replace("{n}",k).replace("{m}",NMIN);c.classList.toggle("ok",ok);document.getElementById("r-"+id).hidden=!ok;persist()}));
  document.getElementById("bk").onclick=()=>{view="parts";render()};
}
function renderEnd(){
  const u=U();
  app.innerHTML=`<div class="top"><span class="mono">${u.title}</span>${langBar()}</div>
  <div class="end"><h1 style="font-size:clamp(28px,5vw,42px)">${st.part===1?u.endT:st.part===2?u.endT2:u.endT3}</h1><p style="margin:0">${st.part===1?u.endP:st.part===2?u.endP2:u.endP3}</p>
  <div class="row"><button class="btn primary" id="nbB">${u.notebook}</button><button class="btn" id="bk">${u.back}</button></div></div>`;
  document.getElementById("nbB").onclick=()=>{view="nb";render()};
  document.getElementById("bk").onclick=()=>{view="parts";render()};
}
function setSync(){const el=document.getElementById("sy");if(!el)return;const u=U();el.textContent=syncState==="online"?u.savedOnline:syncState==="saving"?u.saving:u.saved}
function persist(now){
  if(!profile||!st)return;
  st.updatedAt=Date.now();
  ls.set("hol-p:"+profile.slug,{pinHash:profile.pinHash,state:st});
  if(!db)return;
  clearTimeout(saveTimer); syncState="saving"; setSync();
  saveTimer=setTimeout(async()=>{try{await db.doc("profiles/"+profile.slug).set({name:profile.name,pinHash:profile.pinHash,state:st,updatedAt:st.updatedAt});syncState="online"}catch(e){syncState="local"}setSync()},now?50:1200);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;ls.set("hol-lang",lang);render()});
render();
(async()=>{try{if(window.claude&&claude.use){db=await claude.use("db")}}catch(e){db=null}})();
</script>
